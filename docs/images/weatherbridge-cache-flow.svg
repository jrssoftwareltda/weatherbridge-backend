<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">WeatherBridge cache request flow</title>
  <desc id="desc">A request moves from the REST controller to the application service, through the weather provider port, to the Spring Cache proxy and Redis. On a cache miss, the OpenWeather adapter calls the external API and stores the mapped domain object in Redis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="500" fill="#f8fafc"/>
  <text x="70" y="62" class="title">WeatherBridge Cache Request Flow</text>
  <text x="70" y="94" class="subtitle">The application remains cache-agnostic; caching is handled at the outbound adapter boundary.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="190" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="165" y="210" text-anchor="middle" class="box-title">REST Controller</text>
    <text x="165" y="240" text-anchor="middle" class="box-text">Receives city, state,</text>
    <text x="165" y="260" text-anchor="middle" class="box-text">and country parameters</text>

    <rect x="320" y="170" width="210" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="425" y="210" text-anchor="middle" class="box-title">WeatherQueryService</text>
    <text x="425" y="240" text-anchor="middle" class="box-text">Executes the use case</text>
    <text x="425" y="260" text-anchor="middle" class="box-text">without cache knowledge</text>

    <rect x="590" y="170" width="190" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="685" y="210" text-anchor="middle" class="box-title">Provider Port</text>
    <text x="685" y="240" text-anchor="middle" class="box-text">WeatherProviderPort</text>
    <text x="685" y="260" text-anchor="middle" class="box-text">defines the boundary</text>

    <rect x="840" y="145" width="220" height="160" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="950" y="190" text-anchor="middle" class="box-title">Spring Cache Proxy</text>
    <text x="950" y="220" text-anchor="middle" class="box-text">Builds the normalized key</text>
    <text x="950" y="245" text-anchor="middle" class="box-text">and checks Redis before</text>
    <text x="950" y="270" text-anchor="middle" class="box-text">executing the adapter method</text>

    <rect x="1120" y="145" width="210" height="160" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1225" y="190" text-anchor="middle" class="box-title">Redis</text>
    <text x="1225" y="220" text-anchor="middle" class="box-text">Stores mapped domain objects</text>
    <text x="1225" y="245" text-anchor="middle" class="box-text">with a cache-specific TTL</text>
    <text x="1225" y="270" text-anchor="middle" class="box-text">and automatic expiration</text>
  </g>

  <path d="M260 225 H320" class="arrow"/>
  <path d="M530 225 H590" class="arrow"/>
  <path d="M780 225 H840" class="arrow"/>
  <path d="M1060 225 H1120" class="arrow"/>

  <text x="1088" y="205" text-anchor="middle" class="label">lookup</text>

  <g filter="url(#shadow)">
    <rect x="840" y="360" width="220" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="950" y="398" text-anchor="middle" class="box-title">OpenWeatherAdapter</text>
    <text x="950" y="425" text-anchor="middle" class="box-text">Runs only on cache miss</text>

    <rect x="1120" y="360" width="210" height="95" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1225" y="398" text-anchor="middle" class="box-title">OpenWeather API</text>
    <text x="1225" y="425" text-anchor="middle" class="box-text">External upstream service</text>
  </g>

  <path d="M950 305 V360" class="arrow-dashed"/>
  <text x="968" y="338" class="label">miss</text>
  <path d="M1060 407 H1120" class="arrow"/>
  <path d="M1225 360 V325 H1010 V305" class="arrow-dashed"/>
  <text x="1110" y="342" text-anchor="middle" class="label">map, store, return</text>

  <path d="M1225 145 V120 H950 V145" class="arrow-dashed"/>
  <text x="1088" y="112" text-anchor="middle" class="label">cache hit: return immediately</text>
</svg>
