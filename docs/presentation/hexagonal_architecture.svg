<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hexagonal Architecture — Ports and Adapters</title>
  <desc id="desc">An original diagram showing inbound adapters, input ports, the application core, output ports, and outbound adapters.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d59"/>
      <stop offset="100%" stop-color="#0b2436"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 22px; fill: #475569; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .box-title { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .box-text { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #334155; }
      .port-label { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .core-title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #ffffff; }
      .core-text { font-family: Inter, Arial, sans-serif; font-size: 19px; fill: #dbeafe; }
      .caption { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <text x="800" y="72" text-anchor="middle" class="title">Hexagonal Architecture</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Ports and Adapters — dependencies point toward the application core</text>

  <text x="215" y="168" text-anchor="middle" class="section">Inbound Side</text>
  <text x="1385" y="168" text-anchor="middle" class="section">Outbound Side</text>

  <!-- Inbound adapters -->
  <g filter="url(#shadow)">
    <rect x="55" y="215" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="215" y="253" text-anchor="middle" class="box-title">REST / GraphQL</text>
    <text x="215" y="284" text-anchor="middle" class="box-text">Controllers and resolvers</text>
    <text x="215" y="309" text-anchor="middle" class="box-text">translate transport into use cases</text>

    <rect x="55" y="365" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="215" y="403" text-anchor="middle" class="box-title">Messaging / Events</text>
    <text x="215" y="434" text-anchor="middle" class="box-text">Consumers receive commands,</text>
    <text x="215" y="459" text-anchor="middle" class="box-text">events, or integration messages</text>

    <rect x="55" y="515" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="215" y="553" text-anchor="middle" class="box-title">CLI / Scheduler</text>
    <text x="215" y="584" text-anchor="middle" class="box-text">Commands and scheduled jobs</text>
    <text x="215" y="609" text-anchor="middle" class="box-text">start application workflows</text>
  </g>

  <!-- Outbound adapters -->
  <g filter="url(#shadow)">
    <rect x="1225" y="215" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1385" y="253" text-anchor="middle" class="box-title">Persistence</text>
    <text x="1385" y="284" text-anchor="middle" class="box-text">PostgreSQL, MongoDB, JPA,</text>
    <text x="1385" y="309" text-anchor="middle" class="box-text">files, or in-memory storage</text>

    <rect x="1225" y="365" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1385" y="403" text-anchor="middle" class="box-title">External Services</text>
    <text x="1385" y="434" text-anchor="middle" class="box-text">Payment, weather, identity,</text>
    <text x="1385" y="459" text-anchor="middle" class="box-text">email, storage, and other APIs</text>

    <rect x="1225" y="515" rx="18" ry="18" width="320" height="115" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1385" y="553" text-anchor="middle" class="box-title">Infrastructure</text>
    <text x="1385" y="584" text-anchor="middle" class="box-text">Cache, event bus, observability,</text>
    <text x="1385" y="609" text-anchor="middle" class="box-text">queues, and notifications</text>
  </g>

  <!-- Main hexagon -->
  <polygon points="800,175 1090,345 1090,655 800,825 510,655 510,345"
           fill="#dbeafe" stroke="#1d4ed8" stroke-width="5" filter="url(#shadow)"/>

  <!-- Core hexagon -->
  <polygon points="800,280 970,380 970,620 800,720 630,620 630,380"
           fill="url(#core)" stroke="#0f172a" stroke-width="4"/>

  <!-- Input and output port bands -->
  <path d="M510 345 L630 380 L630 620 L510 655 Z" fill="#2563eb" opacity="0.96"/>
  <path d="M1090 345 L970 380 L970 620 L1090 655 Z" fill="#0f766e" opacity="0.96"/>

  <text x="566" y="500" text-anchor="middle" class="port-label" transform="rotate(-90 566 500)">INPUT PORTS</text>
  <text x="1034" y="500" text-anchor="middle" class="port-label" transform="rotate(90 1034 500)">OUTPUT PORTS</text>

  <text x="800" y="398" text-anchor="middle" class="core-title">Application Core</text>
  <text x="800" y="445" text-anchor="middle" class="core-text">Use cases and application services</text>
  <text x="800" y="486" text-anchor="middle" class="core-text">Domain entities and value objects</text>
  <text x="800" y="527" text-anchor="middle" class="core-text">Business rules and policies</text>
  <line x1="705" y1="555" x2="895" y2="555" stroke="#93c5fd" stroke-width="2" opacity="0.75"/>
  <text x="800" y="594" text-anchor="middle" class="core-text">No dependency on frameworks,</text>
  <text x="800" y="625" text-anchor="middle" class="core-text">databases, protocols, or vendors</text>

  <!-- Arrows inbound -->
  <line x1="375" y1="272" x2="507" y2="370" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="375" y1="422" x2="502" y2="455" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="375" y1="572" x2="507" y2="625" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Arrows outbound -->
  <line x1="1093" y1="370" x2="1220" y2="272" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1098" y1="455" x2="1220" y2="422" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1093" y1="625" x2="1220" y2="572" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Dependency rule -->
  <line x1="160" y1="850" x2="1440" y2="850" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowLight)"/>
  <text x="800" y="890" text-anchor="middle" class="section">Dependency Rule</text>
  <text x="800" y="925" text-anchor="middle" class="subtitle">Adapters depend on ports; the application core does not depend on adapter technologies.</text>
  <text x="800" y="967" text-anchor="middle" class="caption">Original schematic based on the standard Hexagonal Architecture / Ports and Adapters pattern.</text>
</svg>
